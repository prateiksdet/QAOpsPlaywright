name: Playwright NUnit Tests

on:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

env:
  PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}

defaults:
  run:
    working-directory: Playwright_learnings

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Install Playwright Browsers
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps

      - name: Run NUnit Tests
        run: dotnet test --configuration Release --no-build --logger trx

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NUnit-TestResults
          path: Playwright_learnings/**/TestResults/**
